<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrinho 2026 - Minecraft Ambiental</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>AGRINHO 2026</h1>
    <p>Desmatamento, Reflorestamento e Cooperação</p>
  </header>

  <main>

    <section class="intro">
      <h2>Mundo dos Villagers</h2>

      <p>
        Neste jogo inspirado em Minecraft,
        suas escolhas irão definir o futuro da vila.
      </p>

      <button onclick="iniciarJogo()">Iniciar Jornada</button>
    </section>

    <section class="jogo">

      <!-- ❤️ VIDA -->
      <div class="vida-vila">
        <div id="barraVida"></div>
      </div>

      <div class="cenario">

        <div class="arvores" id="arvores">
          🌳 🌳 🌳 🌳 🌳
        </div>

        <div class="farm" id="farm">
          🌾 🌾 🌾 🌾 🌾
        </div>

        <div class="villagers" id="villagers">
          🙂 🙂 🙂
        </div>

      </div>

      <div class="acoes">

        <button onclick="desmatar()">Cortar Árvores</button>
        <button onclick="roubarFarm()">Roubar Farms</button>
        <button onclick="reflorestar()">Reflorestar</button>
        <button onclick="ajudarVillagers()">Ajudar Villagers</button>

      </div>

      <div class="mensagem" id="mensagem">
        Faça sua escolha...
      </div>

    </section>

  </main>

  <footer>
    <p>Projeto Educacional - Agrinho 2026</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
